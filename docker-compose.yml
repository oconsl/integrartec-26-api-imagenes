# Entorno local para probar la API sin AWS:
#   - postgres   → hace de RDS
#   - localstack → emula S3 en http://localhost:4566 (crea el bucket curso-app-imagenes al arrancar)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: curso_app
      POSTGRES_USER: curso
      POSTGRES_PASSWORD: curso1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: sa-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./local/crear-bucket.sh:/etc/localstack/init/ready.d/crear-bucket.sh:ro,Z

volumes:
  pgdata:
